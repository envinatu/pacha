# -----------------------------------------------------------------------------
# sacha spatial module -- language file
# -----------------------------------------------------------------------------
# The file name (without extension) is this language's canonical code, i.e.
# "es" for `language = "es"`. `aliases:` lists extra strings a user may pass
# to `language = ` besides the code itself (which is always accepted).
#
# To add another language: copy this file to inst/<code>.yml (e.g. inst/fr.yml
# for French), translate every value under `labels:` -- keeping exactly the
# same keys -- and optionally list its aliases. No change to the .R source is
# needed.
# -----------------------------------------------------------------------------

aliases:
  - "spanish"
  - "español"
  - "espanol"

labels_geo:
  no_data: "Sin datos disponibles"
  no_occurrences: "No se encontraron ocurrencias de GBIF con coordenadas válidas para"
  no_locations: "No se encontraron registros de distribución geográfica documentados en Catalogue of Life para"
  locations_suffix: "ha sido registrada en las siguientes áreas geográficas"
  map_legend: "Ocurrencias de GBIF"
  popup_year: "Año"
  popup_locality: "Localidad"
  unavailable: "No disponible"
  map_caption: "Distribución de %s, registrada en GBIF, consultado el %s"
  map_short_caption: "Distribución de %s"
  map_caption_crop: "Distribución de %s, en %s, registrada en GBIF, consultado el %s"
  map_short_caption_crop: "Distribución de %s, en %s"
  communication_error: "No se pudo consultar la distribución geográfica de"




















# =============================================================================
# SACHA — ARCHIVO DE IDIOMA: Español (es)
# =============================================================================
#
# Este archivo contiene TODAS las traducciones que sacha usa para el idioma
# "es". El código en R/sacha.R no contiene ningún texto en español: lo lee
# desde aquí en tiempo de ejecución.
#
# Para añadir un nuevo idioma:
#   1. Copie este archivo como inst/lang/<codigo>.yml (por ejemplo fr.yml).
#   2. Cambie `language:` al nuevo código y `aliases:` a las palabras que los
#      usuarios podrán escribir para seleccionarlo.
#   3. Traduzca los valores (nunca las claves) de labels, ranks,
#      establishment y threat.
#   4. Guarde el archivo. No es necesario tocar el archivo .R: sacha detecta
#      automáticamente cualquier archivo *.yml presente en inst/lang/.
#
# Para agregar más alias o corregir una traducción del español, edite
# directamente los valores de este archivo.

# Código canónico del idioma. Debe coincidir con el nombre de este archivo
# (es.yml -> "es").
#language: es

# Palabras que el usuario puede pasar a sacha_configure(language = ...) o a
# sacha_set_language() para seleccionar este idioma. No hace falta incluir
# "es": siempre se añade automáticamente a partir del nombre del archivo.
#aliases:
#  - es
#  - spanish
 # - español
 # - espanol

