# -----------------------------------------------------------------------------
# sacha spatial module -- language file
# -----------------------------------------------------------------------------
# The file name (without extension) is this language's canonical code, i.e.
# "en" for `language = "en"`. `aliases:` lists extra strings a user may pass
# to `language = ` besides the code itself (which is always accepted).
#
# To add another language: copy this file to inst/<code>.yml (e.g. inst/fr.yml
# for French), translate every value under `labels:` -- keeping exactly the
# same keys -- and optionally list its aliases. No change to the .R source is
# needed.
# -----------------------------------------------------------------------------

aliases:
  - "english"
  - "inglés"
  - "ingles"

labels_geo:
  no_data: "No data available"
  no_occurrences: "No GBIF occurrences with valid coordinates were found for"
  no_locations: "No documented geographic distribution records were found in Catalogue of Life for"
  locations_suffix: "has been recorded in the following geographic areas"
  map_legend: "GBIF occurrences"
  popup_year: "Year"
  popup_locality: "Locality"
  unavailable: "Not available"
  map_caption: "Distribution of %s, recorded in GBIF, accessed on %s"
  map_short_caption: "Distribution of %s"
  map_caption_crop: "Distribution of %s, in %s, recorded in GBIF, accessed on %s"
  map_short_caption_crop: "Distribution of %s, in %s"
  communication_error: "Could not retrieve the geographic distribution of"    # en.yml



















# =============================================================================
# SACHA — LANGUAGE FILE: English (en)
# =============================================================================
#
# This file contains ALL translations sacha uses for the "en" language.
# R/sacha.R contains no English text of its own: it reads it from here at
# runtime.
#
# To add a new language:
#   1. Copy this file as inst/lang/<code>.yml (e.g. fr.yml).
#   2. Change `language:` to the new code and `aliases:` to the words users
#      will be able to type to select it.
#   3. Translate the VALUES (never the keys) of labels, ranks,
#      establishment, and threat.
#   4. Save the file. There is no need to touch the .R file: sacha
#      automatically discovers every *.yml file present in inst/lang/.
#
# To add more aliases or fix an English translation, edit the values in this
# file directly.

# Canonical language code. Must match this file's name (en.yml -> "en").
#language: en

# Words the user may pass to sacha_configure(language = ...) or
# sacha_set_language() to select this language. "en" itself does not need to
# be listed: it is always added automatically from the file name.
#aliases:
#  - en
#  - english
#  - inglés
#  - ingles

